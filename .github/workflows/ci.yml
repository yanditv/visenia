name: CI - Integración Continua Viseña

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-and-lint:
    name: Verificación de Formato y Calidad de Código (RNF-15)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Validar formato con Prettier
        run: npx prettier --check "**/*.{ts,tsx,js,json,md,yml,yaml}"

  schema-validation:
    name: Validación de Contratos JSON Schema (ERS 6.1, 6.2)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar sintaxis de JSON Schemas
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const schemasDir = path.join(process.cwd(), "data", "schemas");
            if (fs.existsSync(schemasDir)) {
              const files = fs.readdirSync(schemasDir).filter(f => f.endsWith(".json"));
              files.forEach(file => {
                const content = fs.readFileSync(path.join(schemasDir, file), "utf-8");
                JSON.parse(content);
                console.log(`[OK] Schema JSON valido: ${file}`);
              });
            }
          '

  test:
    name: Pruebas Automatizadas Unitarias (RNF-15)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar pruebas en workspaces
        run: npm test --workspaces --if-present
