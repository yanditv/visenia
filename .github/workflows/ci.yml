name: CI - Integración Continua Viseña

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-and-lint:
    name: Verificación de Formato y Calidad de Código (RNF-15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Validar formato con Prettier
        run: bun run format:check

      - name: Analizar tipos y sintaxis
        run: bun run lint
      - name: Verificar el contrato y el motor LSEC de consumo
        run: bun x --no-install tsc --noEmit --strict --target ES2022 --moduleResolution bundler --module ES2022 ../frontend-contract/example-lsec-client.ts ../frontend-contract/motor-lsec.ts

  schema-validation:
    name: Validación de Contratos JSON Schema (ERS 6.1, 6.2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Validar contratos y referencias publicadas
        run: bun run validate:catalog

  test:
    name: Pruebas Automatizadas Unitarias (RNF-15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar pruebas
        run: bun run test

      - name: Compilar la aplicación
        run: bun run build

  backend-and-deploy:
    name: Verificación de API e infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar bibliotecas nativas
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - name: Instalar dependencias del servidor
        run: python -m pip install -r backend/requirements.txt
      - name: Probar evaluación LSEC y compatibilidad del backend
        working-directory: backend
        run: python -m pytest -q
      - name: Validar Docker Compose
        env:
          POSTGRES_PASSWORD: ci-config-only
        run: docker compose -f frontend/deploy/docker-compose.yml config --quiet
      - name: Validar Caddy
        run: docker run --rm -v "$PWD/frontend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
