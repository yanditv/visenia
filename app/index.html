<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Espejo de Práctica de Lengua de Señas - Viseña (Sprint 1 / RF-01, RF-02, RF-42)" />
  <link rel="manifest" href="/manifest.json" />
  <title>Viseña - Espejo de Señas (PWA)</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="logo-area">
        <h1>Viseña</h1>
        <span class="badge">Sprint 1 • RF-01 / RF-02 / RF-42</span>
      </div>
      <div class="hud-stats">
        <span id="fps-display">FPS: --</span>
        <span id="status-display" class="status-indicator">Iniciando cámara...</span>
      </div>
    </header>

    <!-- Layout dividido: Espejo usuario (izq) | Avatar guía (der) -->
    <main class="split-container">

      <!-- Panel izquierdo: espejo del usuario -->
      <section class="panel panel-usuario" aria-label="Espejo del usuario">
        <div class="panel-label">Tú</div>
        <div class="viewport-wrapper">
          <video id="webcam-video" autoplay playsinline muted></video>
          <canvas id="skeleton-canvas"></canvas>

          <div id="encuadre-overlay" class="encuadre-overlay">
            <div class="encuadre-box">
              <span class="encuadre-tip">Ubica tu torso y manos dentro del área</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Panel derecho: avatar guía VRM -->
      <section class="panel panel-avatar" aria-label="Avatar guía">
        <div class="panel-label">Avatar Guía</div>
        <div id="avatar-container" class="avatar-wrapper">
          <div id="avatar-loading" class="avatar-loading">
            <span class="avatar-loading-text">Cargando avatar…</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Controles y leyenda -->
    <div class="controls-panel">
      <button id="btn-toggle-camera" class="btn btn-primary">Encender Cámara</button>
      <button id="btn-toggle-synthetic" class="btn btn-secondary">Modo Simulación (Spike)</button>
      <div class="legend">
        <span class="dot pose-dot"></span> Torso / Pose
        <span class="dot hand-dot"></span> Manos (21 pts)
        <span class="dot face-dot"></span> Rostro
      </div>
    </div>

    <footer class="app-footer">
      <small>Proyecto Viseña — Fondo INVENTA • Desarrollador B (Lucas) • PWA Espejo Digital</small>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
