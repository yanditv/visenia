asyncapi: 3.0.0
info:
  title: VISENA experimental ASL recognition
  version: 2.0.0
  description: OpenHands BERT/WLASL2000 classifies ASL; DRINK can also report the observed practice hand. No execution score is available.
servers:
  local:
    host: 127.0.0.1:8000
    protocol: ws
channels:
  recognition:
    address: /ws/v2/visena/recognize
    messages:
      sessionStart: { $ref: '#/components/messages/sessionStart' }
      sessionReady: { $ref: '#/components/messages/sessionReady' }
      evaluationBegin: { $ref: '#/components/messages/evaluationBegin' }
      frame: { $ref: '#/components/messages/frame' }
      evaluationPartial: { $ref: '#/components/messages/evaluationPartial' }
      evaluationEnd: { $ref: '#/components/messages/evaluationEnd' }
      evaluationFinal: { $ref: '#/components/messages/evaluationFinal' }
      evaluationReset: { $ref: '#/components/messages/evaluationReset' }
      sessionStop: { $ref: '#/components/messages/sessionStop' }
      error: { $ref: '#/components/messages/error' }
operations:
  clientToServer:
    action: send
    channel: { $ref: '#/channels/recognition' }
    messages:
      - { $ref: '#/channels/recognition/messages/sessionStart' }
      - { $ref: '#/channels/recognition/messages/evaluationBegin' }
      - { $ref: '#/channels/recognition/messages/frame' }
      - { $ref: '#/channels/recognition/messages/evaluationEnd' }
      - { $ref: '#/channels/recognition/messages/evaluationReset' }
      - { $ref: '#/channels/recognition/messages/sessionStop' }
  serverToClient:
    action: receive
    channel: { $ref: '#/channels/recognition' }
    messages:
      - { $ref: '#/channels/recognition/messages/sessionReady' }
      - { $ref: '#/channels/recognition/messages/evaluationPartial' }
      - { $ref: '#/channels/recognition/messages/evaluationFinal' }
      - { $ref: '#/channels/recognition/messages/error' }
components:
  messages:
    sessionStart:
      name: session.start
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, target_gloss, capture]
        properties:
          type: {const: session.start}
          protocol_version: {const: '2.0'}
          target_gloss: {type: string}
          practice_hand: {enum: [left, right, either], default: either}
          capture:
            type: object
            required: [width, height, fps, frame_encoding]
            properties:
              width: {type: integer, minimum: 1}
              height: {type: integer, minimum: 1}
              fps: {type: number, exclusiveMinimum: 0}
              frame_encoding: {const: jpeg}
    sessionReady:
      name: session.ready
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, session_id, target_gloss, status, server_build]
        properties:
          type: {const: session.ready}
          protocol_version: {const: '2.0'}
          session_id: {type: string, format: uuid}
          target_gloss: {type: string}
          status: {const: ready}
          server_build: {type: string}
    evaluationBegin:
      name: evaluation.begin
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlBegin' }
    frame:
      name: frame
      contentType: application/octet-stream
      description: '12-byte header: uint64 little endian timestamp_ms; uint32 little endian frame_sequence; then JPEG bytes.'
      payload: {type: string, format: binary}
    evaluationPartial:
      name: evaluation.partial
      contentType: application/json
      payload: { $ref: '#/components/schemas/result' }
    evaluationEnd:
      name: evaluation.end
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlEnd' }
    evaluationFinal:
      name: evaluation.final
      contentType: application/json
      payload: { $ref: '#/components/schemas/result' }
    evaluationReset:
      name: evaluation.reset
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlReset' }
    sessionStop:
      name: session.stop
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlStop' }
    error:
      name: error
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, code, message, recoverable]
        properties:
          type: {const: error}
          protocol_version: {const: '2.0'}
          session_id: {type: [string, 'null']}
          code: {type: string}
          message: {type: string}
          recoverable: {type: boolean}
  schemas:
    controlBegin:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.begin}
        protocol_version: {const: '2.0'}
    controlEnd:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.end}
        protocol_version: {const: '2.0'}
    controlReset:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.reset}
        protocol_version: {const: '2.0'}
    controlStop:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: session.stop}
        protocol_version: {const: '2.0'}
    result:
      type: object
      required: [type, protocol_version, session_id, target_gloss, status, quality, recognition, execution_score, execution_score_status, feedback, feedback_source, feedback_status, feedback_summary, feedback_http_status, warnings]
      properties:
        type: {enum: [evaluation.partial, evaluation.final]}
        protocol_version: {const: '2.0'}
        session_id: {type: string, format: uuid}
        target_gloss: {type: string}
        frame_sequence: {type: [integer, 'null']}
        timestamp_ms: {type: [integer, 'null']}
        status: {enum: [partial, complete]}
        quality: {type: object}
        recognition:
          type: object
          required: [status, model, target_gloss, target_probability, top_k]
          properties:
            status: {enum: [pending, experimental, insufficient_data, error]}
            model: {const: OpenHands/BERT-WLASL2000}
            target_gloss: {type: string}
            target_probability: {type: [number, 'null']}
            top_k: {type: array, items: {type: object}}
            input_window:
              type: [object, 'null']
              properties:
                frames: {type: integer}
                start_ms: {type: integer}
                end_ms: {type: integer}
                trimmed: {type: boolean}
                focus_hand: {enum: [left, right, null]}
        execution_score: {type: 'null'}
        execution_score_status: {const: awaiting_validation}
        observations:
          type: [object, 'null']
          properties:
            hand_to_mouth: {type: boolean}
            hands_to_mouth:
              type: object
              properties:
                left: {type: boolean}
                right: {type: boolean}
            practice_hand: {enum: [left, right, either]}
            practice_hand_status: {enum: [matching_hand, opposite_hand, observed, not_observed]}
        feedback: {type: array, items: {type: string}}
        feedback_source: {enum: [groq, rules]}
        feedback_status: {enum: [ok, unavailable, error, not_requested]}
        feedback_model: {type: [string, 'null']}
        feedback_summary: {type: string}
        feedback_recommendations: {type: array, items: {type: string}}
        feedback_http_status: {type: [integer, 'null']}
        feedback_diagnostic: {type: [string, 'null']}
        services:
          type: object
          properties:
            mediapipe: {enum: [used, not_used]}
            asl_model: {enum: [used, not_used, error]}
            groq: {enum: [used, not_used, unavailable, error]}
        warnings: {type: array, items: {type: string}}
