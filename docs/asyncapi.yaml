asyncapi: 3.0.0
info:
  title: VISENA realtime evaluation
  version: 1.0.0
  description: Evaluación DTW experimental LSEC por WebSocket; WLASL no es reconocimiento LSEC.
servers:
  local:
    host: localhost:8000
    protocol: ws
channels:
  evaluation:
    address: /ws/v1/visena/evaluate
    messages:
      sessionStart:
        $ref: '#/components/messages/sessionStart'
      sessionReady:
        $ref: '#/components/messages/sessionReady'
      evaluationBegin:
        $ref: '#/components/messages/evaluationBegin'
      frame:
        $ref: '#/components/messages/frame'
      evaluationPartial:
        $ref: '#/components/messages/evaluationPartial'
      evaluationEnd:
        $ref: '#/components/messages/evaluationEnd'
      evaluationFinal:
        $ref: '#/components/messages/evaluationFinal'
      evaluationReset:
        $ref: '#/components/messages/evaluationReset'
      sessionStop:
        $ref: '#/components/messages/sessionStop'
      error:
        $ref: '#/components/messages/error'
operations:
  sendToBackend:
    action: send
    channel:
      $ref: '#/channels/evaluation'
    messages:
      - $ref: '#/channels/evaluation/messages/sessionStart'
      - $ref: '#/channels/evaluation/messages/evaluationBegin'
      - $ref: '#/channels/evaluation/messages/frame'
      - $ref: '#/channels/evaluation/messages/evaluationEnd'
      - $ref: '#/channels/evaluation/messages/evaluationReset'
      - $ref: '#/channels/evaluation/messages/sessionStop'
  receiveFromBackend:
    action: receive
    channel:
      $ref: '#/channels/evaluation'
    messages:
      - $ref: '#/channels/evaluation/messages/sessionReady'
      - $ref: '#/channels/evaluation/messages/evaluationPartial'
      - $ref: '#/channels/evaluation/messages/evaluationFinal'
      - $ref: '#/channels/evaluation/messages/error'
components:
  messages:
    sessionStart:
      name: session.start
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, reference_id, demo_mode, capture]
        properties:
          type: {const: session.start}
          protocol_version: {const: '1.0'}
          reference_id: {type: string, description: UUID de referencia en forma compacta o con guiones}
          demo_mode: {type: boolean}
          capture:
            type: object
            required: [width, height, fps, frame_encoding]
            properties:
              width: {type: integer, minimum: 1}
              height: {type: integer, minimum: 1}
              fps: {type: number, exclusiveMinimum: 0}
              frame_encoding: {const: jpeg}
    sessionReady:
      name: session.ready
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, session_id, reference_id, status]
        properties:
          type: {const: session.ready}
          protocol_version: {const: '1.0'}
          session_id: {type: string, format: uuid}
          reference_id: {type: string}
          status: {const: ready}
    evaluationBegin:
      name: evaluation.begin
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlBegin' }
    frame:
      name: frame
      contentType: application/octet-stream
      description: '12-byte header: uint64 little endian timestamp_ms; uint32 little endian frame_sequence; then JPEG bytes FF D8 ... FF D9.'
      payload: {type: string, format: binary}
    evaluationPartial:
      name: evaluation.partial
      contentType: application/json
      payload: { $ref: '#/components/schemas/evaluationResult' }
    evaluationEnd:
      name: evaluation.end
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlEnd' }
    evaluationFinal:
      name: evaluation.final
      contentType: application/json
      payload: { $ref: '#/components/schemas/evaluationResult' }
    evaluationReset:
      name: evaluation.reset
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlReset' }
    sessionStop:
      name: session.stop
      contentType: application/json
      payload: { $ref: '#/components/schemas/controlStop' }
    error:
      name: error
      contentType: application/json
      payload:
        type: object
        required: [type, protocol_version, code, message, recoverable]
        properties:
          type: {const: error}
          protocol_version: {const: '1.0'}
          session_id: {type: string, format: uuid}
          code: {type: string}
          message: {type: string}
          recoverable: {type: boolean}
  schemas:
    controlBegin:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.begin}
        protocol_version: {const: '1.0'}
    controlEnd:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.end}
        protocol_version: {const: '1.0'}
    controlReset:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: evaluation.reset}
        protocol_version: {const: '1.0'}
    controlStop:
      type: object
      required: [type, protocol_version]
      properties:
        type: {const: session.stop}
        protocol_version: {const: '1.0'}
    evaluationResult:
      type: object
      required: [type, protocol_version, session_id, reference_id, status, quality, parameters, overall, recognition, warnings]
      properties:
        type: {enum: [evaluation.partial, evaluation.final]}
        protocol_version: {const: '1.0'}
        session_id: {type: string, format: uuid}
        reference_id: {type: string}
        frame_sequence: {type: [integer, 'null']}
        timestamp_ms: {type: [integer, 'null']}
        status: {enum: [partial, complete]}
        quality: {type: object}
        parameters: {type: object}
        overall:
          type: object
          properties:
            status: {enum: [ok, partial, insufficient_data, error]}
            demo_score: {type: [number, 'null']}
        recognition: {type: object}
        warnings: {type: array, items: {type: string}}
